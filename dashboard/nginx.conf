server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sert les fichiers statiques du build React. try_files renvoie vers
    # index.html pour toute route inconnue, au cas ou du routing cote client
    # serait ajoute plus tard (sinon F5 sur une sous-route donnerait un 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le frontend appelle toujours "/api/...", jamais l'URL complete de
    # l'API (meme convention qu'en dev avec le proxy Vite). "api" est le nom
    # du service dans docker-compose.yml, resolu par le DNS interne de Docker.
    # Le "/" final sur proxy_pass retire le prefixe "/api" avant de transmettre
    # la requete : /api/stats -> http://api:8000/stats.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
