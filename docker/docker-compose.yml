# Lance l'API et sa base de donnees ensemble.
# Usage : docker compose -f docker/docker-compose.yml up --build

services:
  db:
    image: postgres:15
    container_name: fraud_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: frauddb
    ports:
      - "5432:5432"
    volumes:
      # Volume nomme : les donnees Postgres survivent meme si le conteneur est supprime.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d frauddb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fraud_api
    restart: unless-stopped
    environment:
      # A l'interieur du reseau Docker, la base s'appelle "db" (nom du service
      # ci-dessus), pas "localhost". Cette valeur ecrase celle de .env.
      DATABASE_URL: postgresql://user:password@db:5432/frauddb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Permet de mettre a jour le modele (models/*.pkl) sans reconstruire l'image.
      - ../models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
